name: ci

permissions: read-all

on: 
  pull_request:
    paths:
      - 'charts/**/**'
      - '.github/workflows/**'

env:
  helm-version: "v4.3.1"
  kubeconform-version: "v0.8.0"

jobs:
  lint-chart:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "${{ env.helm-version }}"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml

  super-linter:
    permissions:
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint Code Base
        uses: github/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          VALIDATE_KUBERNETES_KUBECONFORM: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_YAML: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false

  kubeconform-chart:
    runs-on: ubuntu-24.04
    needs:
      - lint-chart
    strategy:
      matrix:
        k8s:
          - v1.35.8
          - v1.36.4
          - v1.37.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "${{ env.helm-version }}"
      - name: Run kubeconform
        env:
          KUBERNETES_VERSION: ${{ matrix.k8s }}
          KUBECONFORM_VERSION: "${{ env.kubeconform-version }}"
        run: .github/kubeconform.sh

  install-chart:
    name: install-chart
    runs-on: ubuntu-24.04
    needs: 
      - kubeconform-chart
    strategy:
      matrix:
        k8s:
          - v1.35.8
          - v1.36.4
          - v1.37.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "${{ env.helm-version }}"

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: if [[ -n "$(ct list-changed --config .github/ct.yaml)" ]]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        if: steps.list-changed.outputs.changed == 'true'
        with:
          config: .github/kind-config.yaml
          node_image: kindest/node:${{ matrix.k8s }}

      - name: Run chart-testing (install)
        run: ct install --config .github/ct.yaml

  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    needs:
      - lint-chart
      - super-linter
      - kubeconform-chart
      - install-chart
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
